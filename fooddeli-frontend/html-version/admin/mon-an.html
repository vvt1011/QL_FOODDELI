<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý món ăn - FoodDeli</title>

    <link rel="stylesheet"
          href="/fooddeli-frontend/html-version/css/style.css">

    <link rel="stylesheet"
          href="/fooddeli-frontend/html-version/css/admin.css">
</head>

<body>

<div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">

        <div class="sidebar-logo">
            <div class="logo-icon">🍔</div>

            <div class="logo-text">
                <strong>FoodDeli</strong>
                <span>Admin Panel</span>
            </div>
        </div>

        <nav class="sidebar-menu">

            <a href="index.html" class="sidebar-item">
                <span class="sidebar-icon">📊</span>
                <span>Tổng quan</span>
            </a>

            <a href="cua-hang.html" class="sidebar-item">
                <span class="sidebar-icon">🏪</span>
                <span>Cửa hàng</span>
            </a>

            <a href="mon-an.html" class="sidebar-item active">
                <span class="sidebar-icon">🍔</span>
                <span>Món ăn</span>
            </a>

        </nav>

    </aside>


    <!-- MAIN -->
    <main class="admin-main">

        <!-- HEADER -->
        <header class="admin-header">

            <div class="page-title">

                <h1>Quản lý món ăn</h1>

                <p>
                    Quản lý danh sách món ăn trên hệ thống
                </p>

            </div>

            <button
                type="button"
                class="btn-primary"
                id="btnThemMonAn">

                <span>＋</span>
                Thêm món ăn

            </button>

        </header>


        <!-- CONTENT -->
        <section class="admin-content">

            <!-- TOOLBAR -->
            <div class="admin-toolbar">

                <div class="search-box">

                    <input
                        type="text"
                        id="searchMonAn"
                        placeholder="Tìm kiếm theo tên món ăn...">

                </div>

                <select id="filterDanhMuc">

                    <option value="">
                        Tất cả danh mục
                    </option>

                </select>

            </div>


            <!-- TABLE -->
            <div class="admin-table-wrapper mon-an-table-wrapper">

                <table class="admin-table mon-an-table">

                    <thead>

                        <tr>

                            <th>STT</th>
                            <th>Mã món</th>
                            <th>Ảnh</th>
                            <th>Tên món</th>
                            <th>Mã cửa hàng</th>
                            <th>Danh mục</th>
                            <th>Giá</th>
                            <th>Đánh giá</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>

                        </tr>

                    </thead>

                    <tbody id="monAnTableBody">

                        <tr>

                            <td
                                colspan="10"
                                class="loading-row">

                                Đang tải dữ liệu...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- FOOTER -->
            <div class="table-footer">

                <div id="recordCount">
                    0 món ăn
                </div>

                <div
                    id="monAnPagination"
                    class="shop-pagination">
                </div>

            </div>


            <!-- FORM -->
            <section
                class="admin-panel mon-an-form-panel"
                id="monAnFormPanel"
                style="display: none;">

                <div class="admin-panel-header">

                    <div>

                        <h2 id="monAnFormTitle">
                            Thêm món ăn
                        </h2>

                        <p>
                            Nhập thông tin món ăn
                        </p>

                    </div>

                </div>


                <form
                    id="monAnForm"
                    class="admin-form">

                    <div class="form-grid">


                        <!-- MÃ MÓN -->
                        <div class="filter-group">

                            <label for="maMonAn">
                                Mã món
                            </label>

                            <input
                                type="text"
                                id="maMonAn"
                                class="admin-input"
                                placeholder="Để trống hệ thống tự tạo"
                            >

                            <small>
                                Có thể để trống khi thêm mới.
                            </small>

                        </div>


                        <!-- CỬA HÀNG -->
                        <div class="filter-group">

                            <label for="maCuaHang">
                                Cửa hàng <span>*</span>
                            </label>

                            <select
                                id="maCuaHang"
                                class="admin-input"
                                required>

                                <option value="">
                                    -- Chọn cửa hàng --
                                </option>

                            </select>

                        </div>


                        <!-- DANH MỤC -->
                        <div class="filter-group">

                            <label for="maDanhMuc">
                                Danh mục <span>*</span>
                            </label>

                            <select
                                id="maDanhMuc"
                                class="admin-input"
                                required>

                                <option value="">
                                    -- Chọn danh mục --
                                </option>

                            </select>

                        </div>


                        <!-- TÊN MÓN -->
                        <div class="filter-group">

                            <label for="tenMonAn">
                                Tên món <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="tenMonAn"
                                class="admin-input"
                                placeholder="Nhập tên món ăn"
                                required>

                        </div>


                        <!-- GIÁ -->
                        <div class="filter-group">

                            <label for="gia">
                                Giá <span>*</span>
                            </label>

                            <input
                                type="number"
                                id="gia"
                                class="admin-input"
                                min="0"
                                step="1000"
                                placeholder="Ví dụ: 50000"
                                required>

                        </div>


                        <!-- ĐÁNH GIÁ -->
                        <div class="filter-group">

                            <label for="danhGia">
                                Đánh giá
                            </label>

                            <input
                                type="number"
                                id="danhGia"
                                class="admin-input"
                                min="0"
                                max="5"
                                step="0.1"
                                value="0">

                        </div>


                        <!-- TRẠNG THÁI -->
                        <div class="filter-group">

                            <label for="trangThai">
                                Trạng thái
                            </label>

                            <select
                                id="trangThai"
                                class="admin-input">

                                <option value="1">
                                    Đang bán
                                </option>

                                <option value="0">
                                    Ngừng bán
                                </option>

                            </select>

                        </div>


                        <!-- ẢNH -->
                        <div class="filter-group">

                            <label for="anhMonAn">
                                Đường dẫn ảnh
                            </label>

                            <input
                                type="text"
                                id="anhMonAn"
                                class="admin-input"
                                placeholder="https://...">

                        </div>


                        <!-- MÔ TẢ -->
                        <div class="filter-group full-width">

                            <label for="moTa">
                                Mô tả
                            </label>

                            <textarea
                                id="moTa"
                                class="admin-input"
                                rows="4"
                                placeholder="Nhập mô tả món ăn"></textarea>

                        </div>

                    </div>


                    <!-- BUTTON -->
                    <div class="form-actions">

                        <button
                            type="button"
                            class="btn-secondary"
                            id="btnHuyMonAn">

                            Hủy

                        </button>

                        <button
                            type="submit"
                            class="btn-primary"
                            id="btnLuuMonAn">

                            Lưu món ăn

                        </button>

                    </div>

                </form>

            </section>

        </section>

    </main>

</div>


<script
    src="/fooddeli-frontend/html-version/js/mon-an.js">
</script>

</body>
</html>
