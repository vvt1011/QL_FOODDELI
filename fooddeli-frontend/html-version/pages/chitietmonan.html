<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chi tiết món ăn - FoodDeli</title>


    <!-- =====================================================
         CSS CHUNG
         FILE NÀY NẰM TRONG pages/
         NÊN PHẢI DÙNG ../
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- =====================================================
         CSS RIÊNG CHI TIẾT MÓN ĂN
         GIỮ NGUYÊN
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #f7f7f7;
            color: #222;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        button {
            font: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .food-detail-header {
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 1000;
        }


        .food-detail-header-inner {
            width: min(
                1180px,
                calc(100% - 32px)
            );

            margin: auto;

            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        .food-detail-logo {
            color: #ff6b00;
            font-size: 26px;
            font-weight: 800;
            white-space: nowrap;
        }


        .food-detail-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }


        .food-detail-nav a {
            color: #444;
            font-size: 15px;
        }


        .food-detail-nav a:hover {
            color: #ff6b00;
        }


        .food-detail-nav a.active {
            color: #ff6b00;
            font-weight: 700;
        }


        /* =====================================================
           HEADER ACTIONS
        ====================================================== */

        .food-detail-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }


        /* =====================================================
           MAIN
        ====================================================== */

        .food-detail-main {
            width: min(
                1100px,
                calc(100% - 32px)
            );

            margin: 35px auto 70px;
        }


        /* =====================================================
           BACK
        ====================================================== */

        .back-link {
            display: inline-flex;
            align-items: center;

            gap: 7px;

            color: #666;

            margin-bottom: 18px;

            font-size: 14px;
        }


        .back-link:hover {
            color: #ff6b00;
        }


        /* =====================================================
           CARD
        ====================================================== */

        .food-detail-card {
            background: #fff;

            border: 1px solid #eee;

            border-radius: 20px;

            overflow: hidden;
        }


        .food-detail-content {
            display: grid;

            grid-template-columns:
                minmax(0, 1.05fr)
                minmax(0, 0.95fr);
        }


        /* =====================================================
           IMAGE
        ====================================================== */

        .food-detail-image {
            min-height: 500px;
            background: #f0f0f0;
        }


        .food-detail-image img {
            width: 100%;
            height: 100%;

            min-height: 500px;

            object-fit: cover;

            display: block;
        }


        /* =====================================================
           INFO
        ====================================================== */

        .food-detail-info {
            padding: 42px;
        }


        .food-detail-title {
            margin: 0 0 12px;

            font-size: 34px;

            line-height: 1.25;

            color: #1f2937;
        }


        .food-detail-rating {
            display: flex;
            align-items: center;

            gap: 9px;

            margin-bottom: 22px;
        }


        .food-detail-stars {
            color: #f59e0b;
            letter-spacing: 1px;
        }


        .food-detail-rating-number {
            color: #555;
            font-weight: 700;
        }


        .food-detail-description {
            color: #666;

            line-height: 1.75;

            font-size: 15px;

            margin-bottom: 28px;
        }


        .food-detail-price {
            color: #ff6b00;

            font-size: 30px;

            font-weight: 800;

            margin-bottom: 22px;
        }


        /* =====================================================
           META
        ====================================================== */

        .food-meta {
            display: grid;

            gap: 11px;

            margin-bottom: 28px;
        }


        .food-meta-row {
            background: #fafafa;

            border-radius: 10px;

            padding: 13px 14px;

            color: #555;
        }


        /* =====================================================
           STATUS
        ====================================================== */

        .food-status {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 22px;

            font-size: 14px;

            font-weight: 700;
        }


        .food-status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;
        }


        .food-status.active {
            color: #138a50;
        }


        .food-status.active .food-status-dot {
            background: #1da56a;
        }


        .food-status.inactive {
            color: #9a3c3c;
        }


        .food-status.inactive .food-status-dot {
            background: #c94a4a;
        }


        /* =====================================================
           BUTTON
        ====================================================== */

        .food-action {
            display: flex;
            gap: 10px;
        }


        .food-btn {
            height: 46px;

            border-radius: 9px;

            padding: 0 22px;

            cursor: pointer;

            font-weight: 700;

            border: 0;
        }


        .food-btn-primary {
            background: #ff6b00;
            color: #fff;

            flex: 1;
        }


        .food-btn-primary:hover {
            background: #e85f00;
        }


        .food-btn-secondary {
            background: #fff;

            border: 1px solid #ddd;

            color: #444;
        }


        .food-btn-secondary:hover {
            border-color: #ff6b00;
            color: #ff6b00;
        }


        .food-btn:disabled {
            background: #ccc;
            color: #fff;

            cursor: not-allowed;

            border-color: #ccc;
        }


        /* =====================================================
           STATE
        ====================================================== */

        .state-box {
            background: #fff;

            border: 1px solid #eee;

            border-radius: 18px;

            padding: 60px 20px;

            text-align: center;

            color: #777;
        }


        .error-box {
            color: #b42318;
        }


        .spinner {
            width: 40px;
            height: 40px;

            margin: 0 auto 14px;

            border: 4px solid #eee;

            border-top-color: #ff6b00;

            border-radius: 50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .food-detail-footer {
            background: #1f2937;

            color: #cbd5e1;

            margin-top: 60px;
        }


        .food-detail-footer-inner {
            width: min(
                1180px,
                calc(100% - 32px)
            );

            margin: auto;

            padding: 35px 0;

            font-size: 14px;

            line-height: 1.7;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 850px) {

            .food-detail-header-inner {
                flex-wrap: wrap;

                padding: 12px 0;
            }


            .food-detail-nav {
                display: none;
            }


            .food-detail-content {
                grid-template-columns: 1fr;
            }


            .food-detail-image,
            .food-detail-image img {
                min-height: 330px;
            }


            .food-detail-info {
                padding: 28px;
            }

        }


        @media (max-width: 520px) {

            .food-detail-title {
                font-size: 28px;
            }


            .food-detail-price {
                font-size: 26px;
            }


            .food-action {
                flex-direction: column;
            }


            .food-btn-secondary {
                order: 2;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="food-detail-header">

        <div class="food-detail-header-inner">


            <!-- LOGO -->

            <a
                href="../index.html"
                class="food-detail-logo"
                data-spa-route="home"
            >
                FoodDeli
            </a>


            <!-- =================================================
                 MENU GIỐNG TRANG CHỦ
            ================================================== -->

            <nav class="food-detail-nav navbar">

                <a
                    href="../index.html"
                    class="nav-link"
                    data-spa-route="home"
                >
                    Trang chủ
                </a>


                <a
                    href="cua-hang.html"
                    class="nav-link"
                    data-spa-route="shops"
                >
                    Cửa hàng
                </a>


                <a
                    href="mon-an.html"
                    class="nav-link active"
                    data-spa-route="food"
                    data-requires-login="true"
                >
                    Món ăn
                </a>


                <a
                    href="don-hang.html"
                    class="nav-link"
                    data-spa-route="orders"
                    data-requires-login="true"
                >
                    Đơn hàng
                </a>

            </nav>


            <!-- =================================================
                 ACTIONS

                 main.js sẽ tự động hiển thị:
                 - Đăng nhập / Đăng ký khi chưa đăng nhập
                 - Giỏ hàng khi khách hàng đăng nhập
                 - Quản trị / Đăng xuất theo role
            ================================================== -->

            <div
                class="food-detail-header-actions header-actions"
                id="headerActions"
            >

                <!-- main.js tự động render -->

            </div>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="food-detail-main">


        <!-- =================================================
             QUAY LẠI CỬA HÀNG
        ================================================== -->

        <a
            href="cua-hang.html"
            class="back-link"
            data-spa-route="shops"
        >
            ← Quay lại cửa hàng
        </a>


        <!-- =================================================
             CHI TIẾT MÓN
        ================================================== -->

        <section id="foodDetail">

            <div class="state-box">

                <div class="spinner"></div>

                Đang tải thông tin món ăn...

            </div>

        </section>


    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="food-detail-footer">

        <div class="food-detail-footer-inner">

            <strong>
                FoodDeli
            </strong>

            <br>

            Nền tảng đặt đồ ăn trực tuyến.

        </div>

    </footer>


    <!-- =====================================================
         MAIN.JS
         PHẢI LOAD TRƯỚC JS CHI TIẾT
    ====================================================== -->

    <script src="../js/main.js"></script>


    <!-- =====================================================
         JS CHI TIẾT MÓN ĂN
    ====================================================== -->

    <script src="../js/chi-tiet-mon-an.js"></script>


</body>

</html>
