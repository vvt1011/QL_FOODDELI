<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - FoodDeli</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="login-page">

        <!-- Bên trái -->
        <section class="login-intro">

            <div>
                <h1>FoodDeli</h1>

                <h2>
                    Đặt món ngon,
                    <br>
                    giao tận nơi.
                </h2>

                <p>
                    Nhanh chóng, tiện lợi và dễ dàng.
                </p>
            </div>

            <p class="login-copyright">
                © 2026 FoodDeli
            </p>

        </section>


        <!-- Bên phải -->
        <section class="login-form-wrapper">

            <div class="login-form">

                <h2>Đăng nhập</h2>

                <p class="login-description">
                    Đăng nhập để tiếp tục sử dụng FoodDeli
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Nhập email của bạn"
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">
                            Mật khẩu
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Nhập mật khẩu"
                        >
                    </div>


                    <div class="forgot-password">
                        <a href="#">
                            Quên mật khẩu?
                        </a>
                    </div>


                    <button
                        type="submit"
                        class="btn login-button"
                    >
                        Đăng nhập
                    </button>

                </form>


                <p class="register-text">
                    Chưa có tài khoản?

                    <a href="dang-ky.html">
                        Đăng ký
                    </a>
                </p>

            </div>

        </section>

    </main>
    <script src="../js/dang-nhap.js"></script>

</body>
</html>
