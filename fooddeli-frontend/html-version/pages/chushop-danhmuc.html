<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Danh mục - FoodDeli</title>

    <link rel="stylesheet" href="../css/chushop.css">
</head>

<body>

    <div class="admin-layout">

        <!-- SIDEBAR -->
        <aside class="admin-sidebar">

            <div class="admin-logo">
                <h2>FoodDeli</h2>
                <span>CHỦ SHOP</span>
            </div>

            <nav class="admin-nav">

                <a href="../chushop.html" class="admin-nav-item">
                    <span>▣</span>
                    <span>Dashboard</span>
                </a>

                <a href="chushop-cuahang.html" class="admin-nav-item">
                    <span>⌂</span>
                    <span>Cửa hàng của tôi</span>
                </a>

                <a href="chushop-danhmuc.html"
                   class="admin-nav-item active">
                    <span>☷</span>
                    <span>Danh mục</span>
                </a>

                <a href="chushop-monan.html" class="admin-nav-item">
                    <span>🍔</span>
                    <span>Món ăn</span>
                </a>

                <a href="chushop-donhang.html" class="admin-nav-item">
                    <span>▤</span>
                    <span>Đơn hàng</span>
                </a>

                <a href="chushop-doanhthu.html" class="admin-nav-item">
                    <span>▥</span>
                    <span>Doanh thu</span>
                </a>
                
</a>

            </nav>

            <div class="admin-sidebar-bottom">
                
                <a
                    href="../index.html"
                    class="back-home"
                >
                    ← Về trang chủ
                </a>

              

            </div>

        </aside>


        <!-- MAIN -->
        <main class="admin-main">

            <header class="admin-header">

                <div>
                    <h1>Danh mục</h1>

                    <p>
                        Quản lý danh mục món ăn của cửa hàng
                    </p>
                </div>

            </header>


            <section class="admin-content">

                <div class="admin-panel">

                    <div class="admin-panel-header">

                        <div>
                            <h2>Danh sách danh mục</h2>

                            <p>
                                Các danh mục món ăn của cửa hàng
                            </p>
                        </div>

                        <button class="admin-btn primary">
                            + Thêm danh mục
                        </button>

                    </div>


                    <div class="admin-table-wrapper">

                        <table class="admin-table">

                            <thead>

                                <tr>
                                    <th>STT</th>
                                    <th>Mã danh mục</th>
                                    <th>Tên danh mục</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>

                            </thead>

                            <tbody>

                                <tr>

                                    <td>1</td>

                                    <td>DM001</td>

                                    <td>Đồ ăn</td>

                                    <td>
                                        <span class="shop-status active">
                                            Hoạt động
                                        </span>
                                    </td>

                                    <td>

                                        <button class="admin-btn secondary">
                                            Sửa
                                        </button>

                                        <button class="admin-btn secondary">
                                            Xóa
                                        </button>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>
<script src="../js/chushop-danhmuc.js"></script>
</body>

</html>
